- insert:
    - id: persona-shell
      name: 'dsh-persona-shell'
      config:
        enabled: true
        trigger: step
        processToolUsage: false
        memoryExtraction: false
        progressNotices: false
        progressMinutes: 5
        provider: ''
        model: ''
        reasoningEffort: '' # 默认优先关闭思考，不支持时按模型能力兼容
        chatProvider: '' # 留空跟随转述模型
        chatModel: ''
        chatThinking: false # 聊天室独立思考开关
        maxRewriteChars: 6000
        maxRatio: 1.35
        timeoutMs: 45000
        keepSamples: 2
